<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Properties</title>
    <link rel="stylesheet" href="style9.css">
</head>
<body>

    <h1>Flexbox Properties</h1>

    <h2>Flex Direction</h2>
    <!-- row mein items horizontal aate hain -->
    <div class="container row">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>

    <!-- column mein items vertical aate hain -->
    <div class="container column">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>

    <h2>Justify Content</h2>
    <!-- space-between items ke beech equal space deta hai -->
    <div class="container justify">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>

    <h2>Align Items</h2>
    <!-- align-items cross axis par items ko arrange karta hai -->
    <div class="container align">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>

</body>
</html>
