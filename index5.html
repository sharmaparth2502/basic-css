<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Units</title>
    <link rel="stylesheet" href="style5.css">
</head>
<body>

    <h1>CSS Units</h1>

    <!-- px fixed hota hai -->
    <div class="box1">200px width</div>

    <!-- % parent ki width ke according hota hai -->
    <div class="box2">50% width</div>

    <!-- em parent ke font size ke according hota hai -->
    <div class="parent">
        <p class="em">Using em</p>
    </div>

    <!-- rem root ke font size ke according hota hai -->
    <p class="rem">Using rem</p>

</body>
</html>
