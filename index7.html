
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position</title>
    <link rel="stylesheet" href="style7.css">
</head>
<body>

    <h1>CSS Position Property</h1>

    <!-- static default position hoti hai -->
    <div class="static">Static Position</div>

    <!-- relative apni original position se move hota hai -->
    <div class="relative">Relative Position</div>

    <!-- absolute nearest positioned parent ke according set hota hai -->
    <div class="parent">
        <div class="absolute">Absolute Position</div>
    </div>

    <!-- fixed screen par ek hi jagah rehta hai -->
    <div class="fixed">Fixed Position</div>

    <!-- sticky scroll karte time top par ruk jata hai -->
    <div class="sticky">Sticky Position</div>

    <p>Scroll down to see the sticky position.</p>
    <div class="space"></div>

</body>
</html>
