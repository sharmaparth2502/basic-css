<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relative CSS Units</title>
    <link rel="stylesheet" href="style6.css">
</head>
<body>

    <h1>Relative CSS Units</h1>

    <!-- % parent ki width ke according hota hai -->
    <div class="parent">
        <div class="child">50% width</div>
    </div>

    <!-- em parent ke font size ke according hota hai -->
    <div class="em-parent">
        <p class="em-text">Using em</p>
    </div>

    <!-- rem root ke font size ke according hota hai -->
    <p class="rem-text">Using rem</p>

    <!-- vh screen ki height ke according hota hai -->
    <div class="height-box">50vh height</div>

    <!-- vw screen ki width ke according hota hai -->
    <div class="width-box">50vw width</div>

</body>
</html>
